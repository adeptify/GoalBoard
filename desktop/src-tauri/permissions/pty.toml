[[permission]]
identifier = "allow-pty-spawn"
description = "Allow spawning a local TUI process in a PTY"
commands.allow = ["pty_spawn"]

[[permission]]
identifier = "allow-pty-write"
description = "Allow writing bytes to a PTY"
commands.allow = ["pty_write"]

[[permission]]
identifier = "allow-pty-resize"
description = "Allow resizing a PTY"
commands.allow = ["pty_resize"]

[[permission]]
identifier = "allow-pty-kill"
description = "Allow killing a PTY child process"
commands.allow = ["pty_kill"]
